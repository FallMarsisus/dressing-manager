<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dressing Virtuel</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6750A4">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="mobile-sidebar-toggle" class="mobile-sidebar-toggle" type="button" aria-label="Ouvrir le menu">
        <span class="icon" id="mobile-sidebar-toggle-icon">menu</span>
    </button>

    <div class="app-layout">

        <aside class="surface sidebar">
            <div class="sidebar-header">
                <h1>Dressing Virtuel</h1>

                <div id="auth-zone" style="margin: 16px 8px;">
                    <button id="btn-login" class="chip"
                        style="width: 100%; justify-content: center; background: var(--md-primary); color: var(--md-on-primary); font-weight: 500;">
                        <span class="icon">login</span> Se connecter
                    </button>

                    <div id="user-profile"
                        style="display: none; align-items: center; justify-content: space-between; background: var(--md-sub-grised); padding: 8px 12px; border-radius: 16px;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <img id="user-photo" src="" alt="Avatar"
                                style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;">
                            <span id="user-name"
                                style="font-size: 14px; font-weight: 500; color: var(--md-on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px;">Utilisateur</span>
                        </div>
                        <button id="btn-logout" class="btn-theme" title="Se déconnecter" type="button">
                            <span class="icon">logout</span>
                        </button>
                    </div>
                </div>
            </div>

          <div class="sidebar-nav" style="margin: 0 8px 16px 8px;">
                <button id="nav-dressing" class="chip active-global" style="width: 100%; justify-content: center; margin-bottom: 8px;">
                    <span class="icon">checkroom</span> Mon Dressing
                </button>
                <button id="nav-outfit" class="chip" style="width: 100%; justify-content: center;">
                    <span class="icon">accessibility_new</span> Créateur de tenue
                </button>
            </div>

            <div id="dressing-filters" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
                <input type="text" id="search-input" class="search-box" placeholder="Rechercher une pièce...">
                <div class="filter-scroll-area">
                    <div style="margin-bottom: 16px;">
                        <button class="chip active" id="btn-tout-voir" data-filter="Tous"
                            style="width: 100%; justify-content: center;">
                            <span class="icon">dashboard</span> Tout voir
                        </button>
                    </div>

                    <h2>Collections</h2>
                    <div class="layout-inline-flow" id="sidebar-pills-target"></div>

                    <h2>Tags</h2>
                    <div class="filter-group" id="filter-gommettes-target"></div>
                </div>
            </div>

            <div id="outfit-sidebar-tools" style="display: none; flex-direction: column; flex: 1; overflow: hidden; margin-top: 8px;">
                <h2 style="margin: 0 8px 12px 8px;">Mes Tenues</h2>
                <div class="outfit-list-v2" id="outfit-selector-list" style="padding: 0 8px;"></div>
                <div style="padding: 0 8px; margin-top: 16px;">
                    <button id="btn-add-outfit-placeholder" class="chip" style="justify-content: center; width: 100%;">
                        <span class="icon">add</span> Nouvelle tenue
                    </button>
                </div>
            </div>

            <div class="sidebar-bottom-actions">
                <button id="theme-toggle" class="btn-theme" title="Changer le thème">
                    <span class="icon" id="theme-icon">dark_mode</span>
                </button>
                <button id="install-btn" class="btn-theme" title="Installer l'application" style="display:none;">
                    <span class="icon">download</span>
                </button>
            </div>
        </aside>

        <main class="surface main-content">
            <div id="view-dressing" class="view-section active">
                <div class="main-header">
                    <h2>Vêtements</h2>
                    <span id="items-count" class="count-badge">0 pièce</span>
                </div>

                <div class="list-scroll">
                    <div class="products-large-grid" id="list-target">
                        <p class="status-text">Chargement...</p>
                    </div>
                </div>
            </div>

            <div id="view-outfit" class="view-section">
                <div class="main-header">
                    <h2>Créateur de tenue</h2>
                    <div style="flex: 1;"></div>
                    <button id="btn-save-outfit" class="chip" style="background: var(--md-primary); color: var(--md-on-primary); border: none; font-weight: 500; padding: 10px 16px;">
                        <span class="icon">save</span> Sauvegarder
                    </button>
                </div>
                <div class="outfit-workspace">

                    <div class="canvas-container" id="outfit-canvas">
                        <div class="silhouette"></div>
                        <p class="canvas-hint" id="canvas-hint">Glisse-dépose un vêtement ici pour l'ajouter</p>
                    </div>

                    <div class="outfit-drawers-right" id="outfit-drawers-right">
                        
                        <div class="horizontal-drawer collapsed" data-category="Hauts" id="drawer-Hauts">
                            <button type="button" class="drawer-handle">
                                <span class="icon">apparel</span>
                                <span class="handle-label">Hauts</span>
                                <span class="icon arrow">chevron_left</span>
                            </button>
                            <div class="drawer-body">
                                <h4>Hauts</h4>
                                <div class="outfit-items-list" id="list-outfit-hauts"></div>
                            </div>
                        </div>

                        <div class="horizontal-drawer collapsed" data-category="Bas" id="drawer-Bas">
                            <button type="button" class="drawer-handle">
                                <span class="icon">line_style</span>
                                <span class="handle-label">Bas</span>
                                <span class="icon arrow">chevron_left</span>
                            </button>
                            <div class="drawer-body">
                                <h4>Bas</h4>
                                <div class="outfit-items-list" id="list-outfit-bas"></div>
                            </div>
                        </div>

                        <div class="horizontal-drawer collapsed" data-category="Chaussures" id="drawer-Chaussures">
                            <button type="button" class="drawer-handle">
                                <span class="icon">footprint</span>
                                <span class="handle-label">Chaussures</span>
                                <span class="icon arrow">chevron_left</span>
                            </button>
                            <div class="drawer-body">
                                <h4>Chaussures</h4>
                                <div class="outfit-items-list" id="list-outfit-chaussures"></div>
                            </div>
                        </div>

                        <div class="horizontal-drawer collapsed" data-category="Autre" id="drawer-Autre">
                            <button type="button" class="drawer-handle">
                                <span class="icon">pending</span>
                                <span class="handle-label">Autres</span>
                                <span class="icon arrow">chevron_left</span>
                            </button>
                            <div class="drawer-body">
                                <h4>Autres</h4>
                                <div class="outfit-items-list" id="list-outfit-autre"></div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>
        
    </div>

    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <button id="fab-add" class="fab-btn" title="Ajouter une pièce">
        <span class="icon">add</span>
    </button>

    <div id="modal-ajout" class="modal-overlay">
        <form id="form-ajout" class="surface modal-box">
            <div class="modal-header">
                <h2 id="modal-title">Nouvelle Pièce</h2>
                <span id="step-indicator" class="step-badge">Étape 1/3</span>
            </div>
            <input type="hidden" id="edit-id">

            <div class="form-step active" data-step="1">
                <span class="section-title-modal">Type de vêtement ?</span>
                <div class="giant-icon-grid">
                    <button type="button" class="btn-giant-choice" data-value="Hauts">
                        <span class="icon text-icon">apparel</span>
                        <span class="label">Hauts</span>
                    </button>
                    <button type="button" class="btn-giant-choice" data-value="Bas">
                        <span class="icon text-icon">line_style</span>
                        <span class="label">Bas</span>
                    </button>
                    <button type="button" class="btn-giant-choice" data-value="Chaussures">
                        <span class="icon text-icon">roller_skating</span>
                        <span class="label">Chaussures</span>
                    </button>
                    <button type="button" class="btn-giant-choice" data-value="Autre">
                        <span class="icon text-icon">pending</span>
                        <span class="label">Autre</span>
                    </button>
                </div>
            </div>

            <div class="form-step" data-step="2">
                <span class="section-title-modal">Sous-catégorie ?</span>
                <div class="subcat-icon-grid" id="form-sub-categories"></div>
            </div>

            <div class="form-step" data-step="3">
                <span class="section-title-modal">Détails de la pièce</span>
                <input type="text" id="nom" class="search-box" style="margin-top: 8px;"
                    placeholder="Nom de la pièce (ex: Robe à fleurs)" required>

                <label class="file-input-wrapper">
                    <span class="icon">add_photo_alternate</span>
                    <span id="file-name-display-modal">Choisir une image</span>
                    <input type="file" id="photo-upload" accept="image/*">
                </label>

                <span class="section-title">Associer des tags</span>
                <div class="form-chip-group" id="form-gommettes"></div>
            </div>

            <div class="modal-actions">
                <button type="button" id="btn-etape-retour" class="btn-text" style="display: none;">Retour</button>
                <div style="flex: 1;"></div>
                <button type="button" id="btn-annuler" class="btn-text">Annuler</button>
                <button type="button" id="btn-etape-suivant" class="btn-filled"
                    style="display: none;">Continuer</button>
                <button type="submit" id="btn-soumettre" class="btn-filled" style="display: none;">Enregistrer</button>
            </div>
        </form>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
